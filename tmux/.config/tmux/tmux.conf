# ============================================================
#  Portable tmux config: macOS (Ghostty) + Ubuntu/WSL
#  Location: ~/.config/tmux/tmux.conf
# ============================================================

# ---- Prefix -------------------------------------------------
# Remap prefix from C-b to C-a (easier to reach). C-a C-a sends a literal C-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Core behavior -----------------------------------------
set -g mouse on                 # click panes/windows, drag borders, scroll
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gapless
set -g history-limit 50000      # bigger scrollback
set -g focus-events on          # let Neovim autoread/autosave hooks fire
set -sg escape-time 10          # no ESC lag in Neovim
set -g detach-on-destroy off    # jump to another session instead of exiting

# ---- True color (so Neovim/Tokyo Night render correctly) ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -as terminal-features ",*:RGB"

# ---- Splits: | and -, and keep the current directory --------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Pane navigation (prefix + hjkl) and resizing -----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Reload config -----------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---- Copy mode: vi keys ------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
set -g set-clipboard on          # OSC52 (Ghostty + Windows Terminal support it)

# ---- Clipboard: OS-aware yank (y in copy mode) --------------
# macOS -> pbcopy
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"
# WSL -> win32yank (install per the setup notes)
if-shell '[ -n "$WSL_DISTRO_NAME" ]' \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'win32yank.exe -i --crlf'"
# Native Linux -> xclip (falls back silently if not installed)
if-shell '[ -z "$WSL_DISTRO_NAME" ] && [ "$(uname)" = "Linux" ]' \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"

# ============================================================
#  Tokyo Night statusline (no plugins required)
# ============================================================
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# left: session name
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"

# right: date + time
set -g status-right-length 60
set -g status-right "#[fg=#7aa2f7]#[bg=#7aa2f7,fg=#1a1b26] %Y-%m-%d #[fg=#bb9af7]#[bg=#bb9af7,fg=#1a1b26,bold] %H:%M "

# windows
setw -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#7dcfff,bold] #I:#W "
setw -g window-status-separator ""

# pane borders
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

# messages
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"

# ============================================================
#  Optional: plugin manager (tpm). Uncomment to use.
#  Install tpm first:
#    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  Then reload and press prefix + I to install plugins.
# ============================================================
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
# set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save sessions
# run '~/.tmux/plugins/tpm/tpm'
